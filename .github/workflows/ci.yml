name: RetailFlow ETL Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-checks:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Formatting & Lint Check (Ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Static Type Analysis (MyPy)
        run: |
          mypy src/

      - name: Run Test Suite (Pytest)
        run: |
          pytest --cov=src/retailflow --cov-report=xml tests/
